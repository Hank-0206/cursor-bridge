<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cursor-bridge 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<div class="boot" id="boot">
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 36 36" fill="none">
      <path d="M6 23c5-9 9-9 12 0s7 9 12 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="18" cy="12.5" r="2.4" fill="#fff"/>
    </svg>
  </span>
  正在连接…
</div>

<div class="app" id="panel">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none">
          <path d="M6 23c5-9 9-9 12 0s7 9 12 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="18" cy="12.5" r="2.4" fill="#fff"/>
        </svg>
      </span>
      <div>
        <h1>cursor-bridge</h1>
        <div class="sub">把 Cursor 模型接到兼容 API</div>
      </div>
    </div>
    <nav class="nav" id="tabs">
      <button data-tab="overview" class="active" type="button">概览</button>
      <button data-tab="keys" type="button">访问令牌</button>
      <button data-tab="models" type="button">模型</button>
      <button data-tab="guide" type="button">接入</button>
      <button data-tab="monitor" type="button">监控</button>
    </nav>
    <div class="top-end">
      <div class="badge" id="statusBadge">连接中...</div>
      <button class="ghost small" type="button" onclick="logout()">退出</button>
    </div>
  </header>

  <div class="content">
    <div class="wrap">
      <div class="page-head">
        <h1 id="pageTitle">运行概览</h1>
        <p id="pageDesc">看状态、配 Key、测链路</p>
      </div>

      <section class="tab-page active" data-page="overview">
        <div class="grid-4" id="statusCards"></div>
        <div class="grid-2">
          <div class="card">
            <div class="card-head">
              <h2>接入 Cursor</h2>
            </div>
            <label class="field-label" for="cursorKeyInput">API Key</label>
            <input type="password" id="cursorKeyInput" placeholder="crsr_...">
            <p class="hint" id="keyStatus"></p>
            <div class="card-foot">
              <div class="row">
                <button class="ghost" type="button" onclick="verifyKey()">测试当前 Key</button>
                <button class="ghost" type="button" onclick="sdkLogin()">浏览器登录</button>
              </div>
              <div class="right">
                <button class="danger" type="button" onclick="clearCursorKey()">清除</button>
                <button type="button" onclick="saveCursorKey()">保存并验证</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <h2>试一试</h2>
            </div>
            <label class="field-label" for="testModel">用这个模型发一条测试</label>
            <select id="testModel"></select>
            <button class="wide" type="button" onclick="testCall()" id="testBtn" style="margin-top:14px">发送测试请求</button>
            <span class="hint" id="testResult"></span>
          </div>
        </div>
      </section>

      <section class="tab-page" data-page="keys" hidden>
        <div class="card table-card">
          <div class="card-head">
            <div>
              <h2>访问令牌</h2>
              <p class="hint">每人一把。滥用就删。不限制则能用全部模型。</p>
            </div>
          </div>
          <div class="composer">
            <input type="text" id="newKeyLabel" placeholder="备注，例如：小明的电脑">
            <button type="button" onclick="addKey()">生成新令牌</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>备注</th>
                  <th>令牌</th>
                  <th>模型</th>
                  <th>创建时间</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="keysTable"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="tab-page" data-page="models" hidden>
        <div class="card">
          <div class="card-head">
            <div>
              <h2>运行策略</h2>
              <p class="hint">未识别的模型名走默认模型</p>
            </div>
            <button type="button" onclick="saveConfig()">保存配置</button>
          </div>
          <div class="grid-2" style="margin-bottom:14px">
            <button type="button" class="tile" id="allowToolsTile" data-switch="allowTools">
              <span>
                <span class="tile-k">桥接客户端工具</span>
                <span class="tile-v" id="allowToolsLabel">开启 · 推荐</span>
              </span>
              <span class="switch" aria-hidden="true"></span>
            </button>
            <button type="button" class="tile" id="maximizeTile" data-switch="maximize">
              <span>
                <span class="tile-k">性能拉满</span>
                <span class="tile-v" id="maximizeLabel">关闭 · 官方默认档</span>
              </span>
              <span class="switch" aria-hidden="true"></span>
            </button>
          </div>
          <select id="allowTools" hidden>
            <option value="true">开启（推荐）</option>
            <option value="false">关闭（纯对话）</option>
          </select>
          <select id="maximize" hidden>
            <option value="true">开启（更耗额度）</option>
            <option value="false">关闭（官方默认档）</option>
          </select>
          <div class="policy">
            <div>
              <label class="field-label" for="defaultModel">默认模型</label>
              <select id="defaultModel"></select>
            </div>
            <div>
              <label class="field-label" for="maxConcurrent">最大并发</label>
              <input type="number" id="maxConcurrent" min="1" max="32">
            </div>
          </div>
          <div style="margin-top:14px">
            <label class="field-label" for="workspaceDir">Agent 工作目录</label>
            <input type="text" id="workspaceDir" placeholder="留空则使用 data/sandbox" spellcheck="false">
            <p class="hint" id="workspaceDirHint"></p>
          </div>
          <details class="fold-block" style="margin-top:14px">
            <summary>手动模型映射</summary>
            <label class="field-label" for="overrides">请求名 → Cursor 模型 id</label>
            <textarea id="overrides" spellcheck="false">{}</textarea>
          </details>
        </div>
        <div class="card table-card">
          <div class="card-head">
            <h2>模型目录</h2>
            <input type="search" id="modelFilter" placeholder="筛选模型" style="max-width:220px" oninput="renderModelCatalog()">
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>模型 id</th>
                  <th>名称</th>
                  <th>别名</th>
                </tr>
              </thead>
              <tbody id="modelsTable"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="tab-page" data-page="guide" hidden>
        <div class="card">
          <div class="card-head">
            <div>
              <h2>接到客户端</h2>
              <p class="hint">左边选方式，右边复制配置</p>
            </div>
          </div>
          <div id="adminSnippets"></div>
        </div>
      </section>

      <section class="tab-page" data-page="monitor" hidden>
        <div class="grid-4" id="usageTotals"></div>
        <div class="card table-card">
          <div class="card-head">
            <div>
              <h2>按令牌用量</h2>
              <p class="hint" id="usageSince"></p>
            </div>
            <button class="danger" type="button" onclick="resetUsageStats()">清零重计</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>令牌</th>
                  <th>请求</th>
                  <th>总消耗</th>
                  <th>输入 / 输出</th>
                  <th>最近使用</th>
                </tr>
              </thead>
              <tbody id="usageTable"></tbody>
            </table>
          </div>
          <p class="empty" id="noUsage">暂无用量记录</p>
        </div>
        <div class="card table-card">
          <div class="card-head">
            <h2>最近请求</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>状态</th>
                  <th>来源</th>
                  <th>模型</th>
                  <th>耗时</th>
                  <th>tokens</th>
                </tr>
              </thead>
              <tbody id="reqTable"></tbody>
            </table>
          </div>
          <p class="empty" id="noReq">暂无请求记录</p>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="overlay" id="modelModal" onclick="if(event.target===this) closeModelModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modelModalTitle">限制可用模型</h3>
    <div class="modal-body">
      <p class="hint" id="modelModalHint" style="margin-top:0"></p>
      <label class="hint" style="display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer">
        <input type="checkbox" id="keyUnlim" onchange="onKeyUnlimChange()" style="width:auto"> 不限制（全部模型）
      </label>
      <input type="search" id="modelSearch" placeholder="筛选模型 id / 名称" oninput="renderModelChecks()" style="margin-bottom:10px">
      <div class="model-list" id="keyChecks"></div>
    </div>
    <div class="modal-foot">
      <button class="ghost" type="button" onclick="closeModelModal()">取消</button>
      <button type="button" onclick="saveKeyModels()">保存</button>
    </div>
  </div>
</div>
<div class="overlay" id="askModal" onclick="if(event.target===this) finishAsk(false)">
  <div class="modal modal-sm" role="dialog" aria-modal="true">
    <h3>请确认</h3>
    <div class="modal-body"><p class="hint" id="askMsg" style="margin:8px 0 0;font-size:14px;color:var(--ink)"></p></div>
    <div class="modal-foot">
      <button class="ghost" type="button" id="askNo">取消</button>
      <button type="button" id="askYes">确定</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let firstTokenCache = "sk-cb-********（在管理面板查看）";
let statusCache = null;
let keysCache = [];
let modelsCache = [];
let editingKeyIndex = -1;
let editingSelected = new Set();
let askResolve = null;

const PAGE_META = {
  overview: { title: "运行概览", desc: "看状态、配 Key、测链路" },
  keys: { title: "访问令牌", desc: "给每位使用者发一把钥匙" },
  models: { title: "模型与行为", desc: "默认模型、工具和并发" },
  guide: { title: "接入指南", desc: "复制配置，接到客户端" },
  monitor: { title: "用量监控", desc: "谁在用、用了多少" },
};

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => {
    t.classList.remove("show");
    t.style.display = "none";
  }, 2600);
}

function ask(message, { danger = false, ok = "确定" } = {}) {
  return new Promise((resolve) => {
    askResolve = resolve;
    $("askMsg").textContent = message;
    $("askYes").textContent = ok;
    $("askYes").className = danger ? "danger-fill" : "";
    $("askModal").classList.add("show");
    $("askYes").focus();
  });
}

function finishAsk(ok) {
  $("askModal").classList.remove("show");
  const resolve = askResolve;
  askResolve = null;
  if (resolve) resolve(ok);
}

$("askYes").addEventListener("click", () => finishAsk(true));
$("askNo").addEventListener("click", () => finishAsk(false));

function apiError(r, fallback = "请求失败") {
  if (typeof r?.error === "string" && r.error) return r.error;
  if (typeof r?.error?.message === "string" && r.error.message) return r.error.message;
  return fallback;
}

function fmtDateTime(ts) {
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function goLogin() {
  location.replace("/login.html");
}

async function logout() {
  try {
    await fetch("/admin/session/logout", { method: "POST", credentials: "same-origin" });
  } catch { /* ignore */ }
  goLogin();
}

async function api(path, opts) {
  const res = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
  if (res.status === 401) {
    goLogin();
    throw Object.assign(new Error("unauthorized"), { unauthorized: true });
  }
  if (res.status === 403) throw Object.assign(new Error("forbidden"), { forbidden: true });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; }
  catch { throw new Error(text.slice(0, 120) || `HTTP ${res.status}`); }
  if (!res.ok && data && data.ok !== false) data.ok = false;
  return data;
}

function copyText(text, el) {
  const done = () => {
    toast("已复制到剪贴板");
    if (el) {
      const prev = el.textContent;
      el.textContent = "已复制";
      el.classList.add("copied");
      setTimeout(() => {
        el.textContent = prev;
        el.classList.remove("copied");
      }, 1400);
    }
  };
  const fail = () => toast("复制失败，请手动选择");
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fail);
    return;
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    ok ? done() : fail();
  } catch {
    fail();
  }
}

function baseUrl() {
  if (statusCache && statusCache.lanAddresses && statusCache.lanAddresses.length > 0 && statusCache.host === "0.0.0.0") {
    return `http://${statusCache.lanAddresses[0]}:${statusCache.port}`;
  }
  return location.origin;
}

function snippetsHtml(token) {
  const base = baseUrl();
  const ccJson = JSON.stringify({ env: { ANTHROPIC_BASE_URL: base, ANTHROPIC_AUTH_TOKEN: token } }, null, 2);
  const claudeJson = JSON.stringify({ env: { ANTHROPIC_BASE_URL: base, ANTHROPIC_AUTH_TOKEN: token } }, null, 2);
  const curlA = `curl ${base}/v1/messages -H "content-type: application/json" -H "x-api-key: ${token}" -d "{\\"model\\":\\"claude-sonnet-4-5\\",\\"max_tokens\\":100,\\"messages\\":[{\\"role\\":\\"user\\",\\"content\\":\\"你好\\"}]}"`;
  const pyOpenai = `from openai import OpenAI\nclient = OpenAI(base_url="${base}/v1", api_key="${token}")\nr = client.chat.completions.create(model="auto", messages=[{"role":"user","content":"你好"}])\nprint(r.choices[0].message.content)`;
  const copy = (text) => `<button class="small ghost copy-btn" type="button" onclick='copyText(${JSON.stringify(text)}, this)'>复制</button>`;
  return `
    <div class="snippet-switch guide">
      <div class="snip-rail">
        <button type="button" data-snip-tab="cc" class="on">cc-switch</button>
        <button type="button" data-snip-tab="claude">Claude Code</button>
        <button type="button" data-snip-tab="openai">OpenAI</button>
        <button type="button" data-snip-tab="curl">连通测试</button>
      </div>
      <div>
        <div class="snip on" data-snip="cc">
          <ol class="steps">
            <li>打开 CC Switch → 添加供应商 → 应用选 <code>Claude Code</code> → 预设选 <code>自定义</code></li>
            <li>名称随意（如 cursor-bridge），JSON 配置粘贴下面内容</li>
            <li>保存并切换到该供应商，重启 Claude Code 即生效</li>
          </ol>
          <div class="code-wrap"><pre>${esc(ccJson)}</pre>${copy(ccJson)}</div>
          <div class="mod-foot"><span></span><button class="sun" type="button" onclick='copyText(${JSON.stringify(ccJson)}, this)'>复制这段配置</button></div>
        </div>
        <div class="snip" data-snip="claude">
          <p class="hint" style="margin-top:0">写入 <code>~/.claude/settings.json</code></p>
          <div class="code-wrap"><pre>${esc(claudeJson)}</pre>${copy(claudeJson)}</div>
          <div class="mod-foot"><span></span><button class="sun" type="button" onclick='copyText(${JSON.stringify(claudeJson)}, this)'>复制这段配置</button></div>
        </div>
        <div class="snip" data-snip="openai">
          <p class="hint" style="margin-top:0">Base URL 填 <code>${esc(base)}/v1</code>，API Key 填访问令牌</p>
          <div class="code-wrap"><pre>${esc(pyOpenai)}</pre>${copy(pyOpenai)}</div>
          <div class="mod-foot"><span></span><button class="sun" type="button" onclick='copyText(${JSON.stringify(pyOpenai)}, this)'>复制这段代码</button></div>
        </div>
        <div class="snip" data-snip="curl">
          <p class="hint" style="margin-top:0">用下面这条命令确认代理能通</p>
          <div class="code-wrap"><pre>${esc(curlA)}</pre>${copy(curlA)}</div>
          <div class="mod-foot"><span></span><button class="sun" type="button" onclick='copyText(${JSON.stringify(curlA)}, this)'>复制这条命令</button></div>
        </div>
      </div>
    </div>`;
}

function switchTab(id) {
  document.querySelectorAll("#tabs [data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll(".tab-page").forEach((p) => {
    const on = p.dataset.page === id;
    p.classList.toggle("active", on);
    p.hidden = !on;
  });
  const meta = PAGE_META[id];
  if (meta) {
    $("pageTitle").textContent = meta.title;
    $("pageDesc").textContent = meta.desc;
  }
  location.hash = id;
}

document.getElementById("tabs")?.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (btn) switchTab(btn.dataset.tab);
});

document.getElementById("usageTable")?.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-fold]");
  if (!btn) return;
  const panel = btn.closest("tr")?.nextElementSibling;
  if (!panel?.classList.contains("fold-row")) return;
  const open = panel.hidden;
  panel.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
});

document.getElementById("adminSnippets")?.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-snip-tab]");
  if (!btn) return;
  const root = btn.closest(".snippet-switch");
  const id = btn.dataset.snipTab;
  root.querySelectorAll("[data-snip-tab]").forEach((el) => el.classList.toggle("on", el.dataset.snipTab === id));
  root.querySelectorAll(".snip[data-snip]").forEach((el) => el.classList.toggle("on", el.dataset.snip === id));
});

function paintTiles() {
  const tools = $("allowTools").value === "true";
  const max = $("maximize").value === "true";
  $("allowToolsTile").classList.toggle("on", tools);
  $("maximizeTile").classList.toggle("on", max);
  $("allowToolsLabel").textContent = tools ? "开启 · 推荐" : "关闭 · 纯对话";
  $("maximizeLabel").textContent = max ? "开启 · 更耗额度" : "关闭 · 官方默认档";
}

document.querySelectorAll("[data-switch]").forEach((tile) => {
  tile.addEventListener("click", () => {
    const sel = $(tile.dataset.switch);
    sel.value = sel.value === "true" ? "false" : "true";
    paintTiles();
  });
});

function renderStatus(s) {
  statusCache = s;
  const badge = $("statusBadge");
  if (s.cursorKey.configured) {
    badge.textContent = s.mock ? "MOCK 模式" : "运行中";
    badge.className = "badge ok";
  } else {
    badge.textContent = "未配置 Cursor Key";
    badge.className = "badge bad";
  }
  const lan = s.host === "0.0.0.0"
    ? (s.lanAddresses.map((ip) => `${ip}:${s.port}`).join(" · ") || "未检测到局域网 IP")
    : `仅 ${esc(s.host)}:${s.port}`;
  const ok = s.cursorKey.configured;
  const src = s.cursorKey.source === "config" ? "面板" : s.cursorKey.source === "env" ? "环境变量" : "浏览器登录";
  $("statusCards").innerHTML = `
    <article class="card metric">
      <div class="k">状态</div>
      <div class="v">${ok ? (s.mock ? "MOCK" : "已接通") : "未接入"}</div>
      <div class="s">${ok ? `Key ${esc(s.cursorKey.preview ?? "")} · ${esc(src)}` : "先配置 Cursor API Key"}</div>
    </article>
    <article class="card metric">
      <div class="k">局域网</div>
      <div class="v">${lan}</div>
    </article>
    <article class="card metric">
      <div class="k">可用模型</div>
      <div class="v">${s.models ? s.models.count : "-"}</div>
    </article>
    <article class="card metric">
      <div class="k">会话</div>
      <div class="v">${s.sessions.active} / ${s.sessions.parked} / ${s.sessions.queued}</div>
      <div class="s">活跃 / 等待 / 排队 · ${Math.floor(s.uptimeSec / 60)} 分钟</div>
    </article>`;
  $("keyStatus").textContent = ok
    ? `当前 Key 来源：${src}`
    : "填写 API Key 后保存。";
  $("allowTools").value = String(s.config.allowClientTools);
  $("maximize").value = String(s.config.maximizeModels ?? false);
  $("maxConcurrent").value = s.config.maxConcurrentRuns;
  if (document.activeElement !== $("workspaceDir")) {
    $("workspaceDir").value = s.config.workspaceDir ?? "";
  }
  $("workspaceDirHint").textContent = s.config.agentCwd
    ? `当前生效：${s.config.agentCwd}`
    : "新会话会使用这个目录作为 Cursor agent 的 cwd";
  paintTiles();
  if (document.activeElement !== $("overrides")) {
    $("overrides").value = JSON.stringify(s.config.modelOverrides ?? {}, null, 2);
  }
}

async function refreshStatus() {
  try {
    renderStatus(await api("/admin/status"));
  } catch (e) {
    if (e.unauthorized) return;
    if (e.forbidden) { goLogin(); return; }
    $("statusBadge").textContent = "连接失败";
    $("statusBadge").className = "badge bad";
  }
}

function aliasCell(aliases) {
  const list = aliases || [];
  if (!list.length) return "";
  if (list.length <= 2) return esc(list.join(" · "));
  return `<details class="alias-fold"><summary>${esc(list.slice(0, 2).join(" · "))} · ${list.length - 2} 个</summary>${esc(list.join(" · "))}</details>`;
}

function renderModelCatalog() {
  const q = ($("modelFilter")?.value || "").trim().toLowerCase();
  const list = (modelsCache || []).filter((m) => {
    if (!q) return true;
    return m.id.toLowerCase().includes(q) || (m.displayName || "").toLowerCase().includes(q) || (m.aliases || []).some((a) => a.toLowerCase().includes(q));
  });
  $("modelsTable").innerHTML = list.length
    ? list.map((m) => `<tr>
        <td class="mono">${esc(m.id)}</td>
        <td>${esc(m.displayName || "")}</td>
        <td class="mono muted">${aliasCell(m.aliases)}</td>
      </tr>`).join("")
    : `<tr><td class="empty-cell" colspan="3">${modelsCache.length ? "没有匹配的模型" : "还没有模型列表，先在概览里接上 Cursor Key"}</td></tr>`;
}

async function refreshModels(refresh) {
  try {
    const r = await api("/admin/models" + (refresh ? "?refresh=1" : ""));
    if (!r.ok) return;
    modelsCache = r.models;
    renderModelCatalog();
    const opts = ['<option value="auto">auto（服务端自动选择）</option>']
      .concat(r.models.filter((m) => m.id !== "auto").map((m) => `<option value="${esc(m.id)}">${esc(m.id)}</option>`)).join("");
    const dm = $("defaultModel"), tm = $("testModel");
    const cur = statusCache?.config?.defaultModel ?? "auto";
    dm.innerHTML = opts; dm.value = cur;
    tm.innerHTML = opts; tm.value = cur;
  } catch { /* ignore */ }
}

async function refreshKeys() {
  try {
    const r = await api("/admin/keys");
    keysCache = r.keys || [];
    if (keysCache.length > 0) firstTokenCache = keysCache[0].key;
    $("keysTable").innerHTML = keysCache.length ? keysCache.map((k, i) => {
      const n = (k.allowedModels || []).length;
      return `<tr>
        <td><strong>${esc(k.label)}</strong></td>
        <td>
          <div class="cell-token">
            <code class="mono">${esc(k.key.slice(0, 12))}...${esc(k.key.slice(-4))}</code>
            <button class="small ghost" type="button" onclick='copyText(${JSON.stringify(k.key)}, this)'>复制</button>
          </div>
        </td>
        <td>${n === 0 ? "不限制" : n + " 个"}</td>
        <td class="muted">${new Date(k.createdAt).toLocaleString()}</td>
        <td class="actions">
          <button class="small ghost" type="button" onclick="openModelModal(${i})">设置模型</button>
          <button class="small danger" type="button" onclick='delKey(${JSON.stringify(k.key)})'>删除</button>
        </td>
      </tr>`;
    }).join("") : `<tr><td class="empty-cell" colspan="5">还没有令牌。上面写个备注，点「生成新令牌」。</td></tr>`;
    $("adminSnippets").innerHTML = snippetsHtml(firstTokenCache);
  } catch { /* ignore */ }
}

function renderModelChecks() {
  const q = ($("modelSearch").value || "").trim().toLowerCase();
  const unlim = $("keyUnlim").checked;
  const list = (modelsCache || []).filter((m) => {
    if (!q) return true;
    return m.id.toLowerCase().includes(q) || (m.displayName || "").toLowerCase().includes(q) || (m.aliases || []).some((a) => a.toLowerCase().includes(q));
  });
  $("keyChecks").innerHTML = list.map((m) => {
    const on = editingSelected.has(m.id.toLowerCase());
    return `<label><input type="checkbox" data-id value="${esc(m.id)}" ${on ? "checked" : ""} ${unlim ? "disabled" : ""} onchange="onModelCheck(this)">
      <span class="mono">${esc(m.id)}</span>
      <span class="alias">${esc(m.displayName || "")}</span></label>`;
  }).join("") || `<span class="muted">${modelsCache.length ? "无匹配" : "暂无模型列表，请先在概览里配置 Cursor Key"}</span>`;
}

function onModelCheck(el) {
  const id = el.value.toLowerCase();
  if (el.checked) editingSelected.add(id);
  else editingSelected.delete(id);
}

async function openModelModal(index) {
  if (!modelsCache.length) await refreshModels();
  const k = keysCache[index];
  if (!k) return;
  editingKeyIndex = index;
  editingSelected = new Set((k.allowedModels || []).map((id) => id.toLowerCase()));
  $("modelModalTitle").textContent = `限制模型 · ${k.label}`;
  $("modelModalHint").textContent = "只勾选该令牌可以使用的 Cursor 模型。不限制时客户端能看到全部模型。";
  $("modelSearch").value = "";
  const unlimited = editingSelected.size === 0;
  $("keyUnlim").checked = unlimited;
  renderModelChecks();
  $("modelModal").classList.add("show");
  $("modelSearch").focus();
}

function closeModelModal() {
  $("modelModal").classList.remove("show");
  editingKeyIndex = -1;
  editingSelected = new Set();
}

function onKeyUnlimChange() {
  const unlim = $("keyUnlim").checked;
  $("keyChecks").querySelectorAll("input[type=checkbox]").forEach((el) => { el.disabled = unlim; });
}

async function saveKeyModels() {
  const k = keysCache[editingKeyIndex];
  if (!k) return;
  const allowedModels = $("keyUnlim").checked
    ? []
    : (modelsCache || []).filter((m) => editingSelected.has(m.id.toLowerCase())).map((m) => m.id);
  if (!$("keyUnlim").checked && allowedModels.length === 0) {
    toast("请至少勾选一个模型，或勾选「不限制」");
    return;
  }
  try {
    const r = await api("/admin/keys/" + encodeURIComponent(k.key), {
      method: "PATCH",
      body: JSON.stringify({ allowedModels }),
    });
    if (!r.ok) {
      toast(apiError(r, "保存失败"));
      return;
    }
    toast(allowedModels.length ? `已限制为 ${allowedModels.length} 个模型` : "已取消模型限制");
    closeModelModal();
    refreshKeys();
  } catch (e) {
    toast("保存失败：" + (e.message || e));
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("modelModal").classList.contains("show")) closeModelModal();
  else if ($("askModal").classList.contains("show")) finishAsk(false);
});

const fmtNum = (n) => (n >= 1e8 ? (n / 1e8).toFixed(2) + "亿" : n >= 1e4 ? (n / 1e4).toFixed(1) + "万" : String(n));

async function refreshUsage() {
  try {
    const r = await api("/admin/usage");
    if (!r.ok) return;
    $("noUsage").style.display = "none";
    $("usageSince").textContent = "统计自 " + new Date(r.since).toLocaleString();
    const t = r.keys.reduce(
      (a, k) => ({
        req: a.req + k.requests, inT: a.inT + k.inputTokens, outT: a.outT + k.outputTokens,
        cw: a.cw + k.cacheWriteTokens, cr: a.cr + k.cacheReadTokens,
      }),
      { req: 0, inT: 0, outT: 0, cw: 0, cr: 0 },
    );
    const grand = t.inT + t.outT + t.cw + t.cr;
    $("usageTotals").innerHTML = `
      <article class="card metric"><div class="k">总消耗</div><div class="v" title="${grand.toLocaleString()}">${fmtNum(grand)}</div><div class="s">tokens</div></article>
      <article class="card metric"><div class="k">请求</div><div class="v">${t.req.toLocaleString()}</div></article>
      <article class="card metric"><div class="k">输入 / 输出</div><div class="v">${fmtNum(t.inT)} / ${fmtNum(t.outT)}</div></article>
      <article class="card metric"><div class="k">缓存写 / 读</div><div class="v">${fmtNum(t.cw)} / ${fmtNum(t.cr)}</div></article>`;
    const opened = new Set(
      [...$("usageTable").querySelectorAll(".fold-row:not([hidden])")]
        .map((row) => row.previousElementSibling?.dataset.label)
        .filter(Boolean),
    );
    $("usageTable").innerHTML = r.keys.map((k) => {
      const total = k.inputTokens + k.outputTokens + k.cacheWriteTokens + k.cacheReadTokens;
      const models = Object.entries(k.models)
        .sort((a, b) => b[1].inputTokens + b[1].outputTokens - (a[1].inputTokens + a[1].outputTokens));
      const open = opened.has(k.label);
      const head = models.length
        ? `<button type="button" class="fold-toggle" data-fold aria-expanded="${open}">
            <span class="chev" aria-hidden="true"></span>
            <strong>${esc(k.label)}</strong>
            <span class="count">${models.length} 个模型</span>
          </button>`
        : `<strong>${esc(k.label)}</strong>`;
      const detail = models.length
        ? `<tr class="fold-row"${open ? "" : " hidden"}>
            <td colspan="5">
              <table class="mini-table">
                <thead><tr><th>模型</th><th>消耗</th><th>请求</th></tr></thead>
                <tbody>${models.map(([m, v]) => `<tr>
                  <td class="mono">${esc(m)}</td>
                  <td class="num">${fmtNum(v.inputTokens + v.outputTokens)}</td>
                  <td class="num">${v.requests}</td>
                </tr>`).join("")}</tbody>
              </table>
            </td>
          </tr>`
        : "";
      return `<tr data-label="${esc(k.label)}">
        <td>${head}</td>
        <td class="num">${k.requests}</td>
        <td class="num" title="${total.toLocaleString()} tokens">${fmtNum(total)}</td>
        <td class="num">${fmtNum(k.inputTokens)} / ${fmtNum(k.outputTokens)}</td>
        <td class="muted">${new Date(k.lastUsed).toLocaleString()}</td>
      </tr>${detail}`;
    }).join("") || `<tr><td class="empty-cell" colspan="5">暂无用量记录</td></tr>`;
  } catch { /* ignore */ }
}

async function resetUsageStats() {
  if (!(await ask("确定清零所有用量统计？此操作不可恢复。", { danger: true, ok: "清零" }))) return;
  await api("/admin/usage/reset", { method: "POST" });
  toast("用量统计已清零");
  refreshUsage();
}

async function refreshRequests() {
  try {
    const r = await api("/admin/requests");
    $("noReq").style.display = "none";
    $("reqTable").innerHTML = r.requests.length ? r.requests.slice(0, 100).map((q) => {
      const tag = q.status === "ok" ? "ok" : q.status === "tool_use" ? "tool" : "err";
      const label = q.status === "ok" ? "完成" : q.status === "tool_use" ? "工具调用" : "错误";
      return `<tr>
        <td class="muted">${fmtDateTime(q.ts)}</td>
        <td><span class="tag ${tag}">${label}</span></td>
        <td>${esc(q.api)} · ${esc(q.keyLabel)}</td>
        <td class="mono">${esc(q.requestedModel)} → ${esc(q.cursorModel)}${q.error ? `<details class="alias-fold"><summary class="muted">错误</summary><div class="muted">${esc(q.error)}</div></details>` : ""}</td>
        <td class="num">${(q.durationMs / 1000).toFixed(1)}s</td>
        <td class="num mono">${q.inputTokens}/${q.outputTokens}</td>
      </tr>`;
    }).join("") : `<tr><td class="empty-cell" colspan="6">暂无请求记录</td></tr>`;
  } catch { /* ignore */ }
}

async function saveCursorKey() {
  const key = $("cursorKeyInput").value.trim();
  if (!key) { toast("请先粘贴 Cursor API Key"); return; }
  toast("验证中...");
  const r = await api("/admin/cursor-key", { method: "POST", body: JSON.stringify({ key }) });
  if (r.ok) {
    toast(`验证成功：${r.user.apiKeyName}${r.user.email ? " / " + r.user.email : ""}，可用模型 ${r.modelCount} 个`);
    $("cursorKeyInput").value = "";
    refreshStatus(); refreshModels();
  } else toast(r.error);
}

async function clearCursorKey() {
  if (!(await ask("清除后面板将不再使用这份 Key，确定？", { danger: true, ok: "清除" }))) return;
  await api("/admin/cursor-key", { method: "DELETE" });
  toast("已清除面板配置的 Key");
  refreshStatus();
}

async function verifyKey() {
  toast("验证中...");
  const r = await api("/admin/verify", { method: "POST" });
  toast(r.ok ? `Key 有效（${r.user.apiKeyName}），模型 ${r.modelCount} 个` : `验证失败：${r.error}`);
  if (r.ok) refreshModels();
}

async function sdkLogin() {
  toast("已发起登录，请在弹出的浏览器窗口完成授权...");
  const r = await api("/admin/login", { method: "POST" });
  toast(r.ok ? "登录成功" : `登录失败：${r.error}`);
  refreshStatus(); refreshModels();
}

async function testCall() {
  const btn = $("testBtn");
  btn.disabled = true;
  $("testResult").innerHTML = '<span class="spin">◌</span> 调用中（首次可能需要十几秒）...';
  try {
    const r = await api("/admin/test", { method: "POST", body: JSON.stringify({ model: $("testModel").value }) });
    $("testResult").textContent = r.ok ? `✓ ${r.model} 回复：${r.text.slice(0, 60)}` : `✗ ${r.error}`;
  } catch (e) {
    $("testResult").textContent = "✗ " + e.message;
  } finally {
    btn.disabled = false;
  }
}

async function addKey() {
  const r = await api("/admin/keys", { method: "POST", body: JSON.stringify({ label: $("newKeyLabel").value }) });
  if (r.ok) { $("newKeyLabel").value = ""; toast("已生成新令牌"); refreshKeys(); }
}

async function delKey(key) {
  if (!(await ask("删除后该令牌立即失效，确定？", { danger: true, ok: "删除" }))) return;
  const r = await api("/admin/keys/" + encodeURIComponent(key), { method: "DELETE" });
  toast(r.ok ? "已删除" : r.error);
  refreshKeys();
}

async function saveConfig() {
  let overrides;
  try {
    overrides = JSON.parse($("overrides").value || "{}");
  } catch { toast("模型映射不是合法 JSON"); return; }
  const r = await api("/admin/config", {
    method: "PATCH",
    body: JSON.stringify({
      defaultModel: $("defaultModel").value,
      allowClientTools: $("allowTools").value === "true",
      maximizeModels: $("maximize").value === "true",
      maxConcurrentRuns: Number($("maxConcurrent").value) || 4,
      workspaceDir: $("workspaceDir").value.trim(),
      modelOverrides: overrides,
    }),
  });
  toast(r.ok ? "配置已保存" : "保存失败");
  refreshStatus();
}

function revealPanel() {
  $("boot").classList.add("hide");
  $("panel").style.display = "flex";
}

(async () => {
  try {
    await api("/admin/status");
    revealPanel();
    await refreshStatus();
    await Promise.all([refreshKeys(), refreshModels(), refreshRequests(), refreshUsage()]);
    await refreshStatus();
    const hash = location.hash.replace("#", "");
    if (["overview", "keys", "models", "guide", "monitor"].includes(hash)) switchTab(hash);
    setInterval(refreshStatus, 5000);
    setInterval(refreshRequests, 5000);
    setInterval(refreshUsage, 10000);
  } catch (e) {
    if (!e.unauthorized) goLogin();
  }
})();
</script>
</body>
</html>
