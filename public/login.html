<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · cursor-bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
</head>
<body class="login-body">
  <div class="login-shell">
    <form class="login-form" id="loginForm">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none">
            <path d="M6 23c5-9 9-9 12 0s7 9 12 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="18" cy="12.5" r="2.4" fill="#fff"/>
          </svg>
        </span>
        <div>
          <h1>cursor-bridge</h1>
          <div class="sub">本地模型桥</div>
        </div>
      </div>
      <h2>登录面板</h2>
      <div class="field">
        <label class="field-label" for="username">账号</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label class="field-label" for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">进入控制台</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
async function alreadyIn() {
  try {
    const res = await fetch("/admin/session", { credentials: "same-origin" });
    const data = await res.json();
    if (data.loggedIn) location.replace("/");
  } catch { /* stay on login */ }
}
alreadyIn();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const err = document.getElementById("err");
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "正在登录…";
  try {
    const res = await fetch("/admin/session/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      err.textContent = data.error || "登录失败";
      return;
    }
    location.replace("/");
  } catch (ex) {
    err.textContent = ex.message || "网络错误";
  } finally {
    btn.disabled = false;
    btn.textContent = "进入控制台";
  }
});
</script>
</body>
</html>
