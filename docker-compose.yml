services:
  cursor-bridge:
    build: .
    image: cursor-bridge:latest
    container_name: cursor-bridge
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-8318}:8318"
    environment:
      PORT: "8318"
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
